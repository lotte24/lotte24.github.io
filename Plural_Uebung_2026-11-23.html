<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2933;--soft:#52606d;--line:#d5d0c4;--blue:#1d4f91;--blue-soft:#e4edf8;--ok:#1b6e3c;--ok-soft:#e1f3e7;--no:#a3271f;--no-soft:#fbe6e3;--tip:#fff5d6;--tip-line:#d9a900}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 Arial,Helvetica,sans-serif}
header{background:var(--blue);color:#fff;padding:16px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:28px;margin:0}
header p{margin:2px 0 0}
#score{font-weight:bold;margin-top:6px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{font:inherit;color:inherit;min-height:50px;border-radius:9px;border:2px solid var(--line);background:#fff;padding:8px 14px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #e08a00;outline-offset:2px}
nav button{font-weight:bold;padding:6px}
nav button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}
h2{font-size:24px;margin:0 0 10px}
h3{font-size:20px;margin:0 0 4px}
.merk{background:var(--blue-soft);border:2px solid var(--blue)}
.merk p{margin:3px 0}
.stars{color:#a86a00;letter-spacing:2px}
.task-head{margin-bottom:10px}
.item{border-top:1px solid var(--line);padding:12px 0}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:8px}
.letter{font-weight:bold;min-width:26px}
.en{font-weight:bold}
.wrongword{color:var(--no);text-decoration:underline wavy;font-weight:bold}
input{font:inherit;min-height:50px;width:190px;max-width:100%;padding:6px 10px;border:2px solid #7b8794;border-radius:8px;background:#fff;color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button[aria-pressed=true]{background:var(--blue-soft);border-color:var(--blue);font-weight:bold}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tip-btn{background:var(--tip);border-color:var(--tip-line);min-height:44px;padding:4px 14px}
.tip,.msg{margin-top:8px;padding:8px 11px;border-radius:8px}
.tip{background:var(--tip);border-left:5px solid var(--tip-line)}
.msg.ok{background:var(--ok-soft);color:var(--ok);font-weight:bold}
.msg.no{background:var(--no-soft);color:var(--no)}
.item.done input,.item.done .opts button{border-color:var(--ok);background:var(--ok-soft)}
.check{width:100%;margin-top:8px;background:var(--blue);border-color:var(--blue);color:#fff;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:7px 5px;vertical-align:top}
.plan{list-style:none;padding:0;margin:0}
.plan li{padding:5px 0;display:flex;gap:9px}
.box{display:inline-grid;place-items:center;width:25px;height:25px;border:2px solid #7b8794;border-radius:5px;flex:none;font-weight:bold;color:var(--ok)}
.go{width:100%;background:var(--blue);border-color:var(--blue);color:#fff;font-weight:bold}
.reset{background:transparent;font-size:16px;width:100%}
@media(max-width:560px){body{font-size:18px}nav button{font-size:16px}table{font-size:15px}}
</style>
</head>

const KEY = "plural-uebung-klasse5-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
let current = "start";
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const en = (text, cls) => { const s = el("span", cls || "en", text); s.lang = "en"; return s; };
const nb = t => t.replace(/(^|[\s(„])-(s|es|ies|ves)\b/g, "$1‑$2");
const norm = s => (s || "").trim().replace(/\s+/g, " ").toLowerCase();
const allItems = () => DATA.parts.flatMap(p => p.tasks.flatMap(t => t.items));
const st = id => state[id] || (state[id] = {});
const taskDone = t => t.items.every(i => st(i.id).ok);
function score() {
  const all = allItems();
  document.getElementById("score").textContent = all.filter(i => st(i.id).ok).length + " von " + all.length + " richtig";
}
function tabs() {
  const box = document.getElementById("tabs"); box.textContent = "";
  [["start", "Start"], ...DATA.parts.map(p => [p.id, "Teil " + p.id])].forEach(([id, label]) => {
    const b = el("button", "", label); b.role = "tab"; b.setAttribute("aria-selected", current === id);
    b.onclick = () => go(id); box.append(b);
  });
}
function go(id) { current = id; tabs(); render(); window.scrollTo(0, 0); }
function renderStart(v) {
  const a = el("section", "card"); a.append(el("h2", "", "So arbeitest du"));
  DATA.intro.forEach(t => a.append(el("p", "", t)));
  const b = el("section", "card"); b.append(el("h2", "", "Wortspeicher"));
  const table = el("table"); const head = el("tr");
  ["Wort", "Bedeutung", "Beispiel"].forEach(t => head.append(el("th", "", t))); table.append(head);
  DATA.wordbank.forEach(r => { const tr = el("tr"); r.forEach(c => tr.append(el("td", "", c))); table.append(tr); });
  b.append(table);
  const c = el("section", "card"); c.append(el("h2", "", "Mein Plan"));
  const ul = el("ul", "plan");
  DATA.parts.forEach(p => p.tasks.forEach((t, n) => {
    const li = el("li"); const done = taskDone(t);
    const box = el("span", "box", done ? "✓" : ""); box.setAttribute("aria-label", done ? "erledigt" : "offen");
    li.append(box, el("span", "", "Teil " + p.id + ", Aufgabe " + (n + 1) + " " + "★".repeat(t.level))); ul.append(li);
  }));
  c.append(ul);
  const go1 = el("button", "go", "Los geht's mit Teil A"); go1.onclick = () => go("A");
  const reset = el("button", "reset", "Alles zurücksetzen");
  reset.onclick = () => { if (confirm("Willst du wirklich alle Antworten löschen?")) { state = {}; save(); score(); render(); } };
  const d = el("div", "card"); d.append(go1); d.style.display = "grid"; d.style.gap = "8px"; d.append(reset);
  v.append(a, b, c, d);
}
function renderItem(it, letter) {
  const s = st(it.id); const box = el("div", "item" + (s.ok ? " done" : "")); box.dataset.id = it.id;
  const line = el("div", "line"); line.append(el("span", "letter", letter + ")"));
  const makeInput = () => {
    const i = document.createElement("input"); i.value = s.value || ""; i.disabled = !!s.ok; i.lang = "en";
    i.setAttribute("autocomplete", "off"); i.setAttribute("autocorrect", "off"); i.setAttribute("autocapitalize", "none"); i.spellcheck = false;
    i.setAttribute("aria-label", "Antwort " + letter); i.oninput = () => { s.value = i.value; save(); }; return i;
  };
  const addSentence = (mid) => { const [x, y] = it.text.split(mid.split); if (x) line.append(en(x, "")); line.append(mid.node); if (y) line.append(en(y, "")); };
  if (it.kind === "write") { line.append(en(it.word), el("span", "", "→"), makeInput()); }
  else if (it.kind === "gap") { addSentence({ split: "___", node: makeInput() }); line.append(el("span", "", "(" + it.word + ")")); }
  else if (it.kind === "fix") { addSentence({ split: it.wrong, node: en(it.wrong, "wrongword") }); }
  else if (it.kind === "agree") { addSentence({ split: "___", node: el("span", "en", "_____") }); }
  else { line.append(en(it.word)); }
  box.append(line);
  if (it.kind === "fix") { const l2 = el("div", "line"); l2.append(el("span", "", "Richtig:"), makeInput()); box.append(l2); }
  if (it.options) {
    const opts = el("div", "opts");
    it.options.forEach(o => {
      const b = el("button", "", o); b.type = "button"; if (o !== "Einzahl" && o !== "Mehrzahl") b.lang = "en";
      b.setAttribute("aria-pressed", s.value === o); b.disabled = !!s.ok;
      b.onclick = () => { s.value = o; save(); opts.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
      opts.append(b);
    });
    box.append(opts);
  }
  const controls = el("div", "controls");
  const tipBtn = el("button", "tip-btn", "Tipp"); tipBtn.type = "button";
  const tips = el("div");
  const drawTips = () => {
    tips.textContent = ""; const n = s.tips || 0;
    if (n > 0) tips.append(el("div", "tip", nb("Tipp 1: " + it.hint1)));
    if (n > 1) tips.append(el("div", "tip", nb("Tipp 2: " + it.hint2)));
    tipBtn.hidden = n >= 2 || !!s.ok; tipBtn.textContent = n === 1 ? "Noch ein Tipp" : "Tipp";
  };
  tipBtn.onclick = () => { s.tips = (s.tips || 0) + 1; save(); drawTips(); };
  drawTips(); controls.append(tipBtn); box.append(controls, tips);
  const msg = el("div"); msg.setAttribute("role", "status"); box.append(msg);
  if (s.checked) showMsg(msg, it, s);
  return box;
}
function showMsg(msg, it, s) {
  if (s.ok) { msg.className = "msg ok"; msg.textContent = "Richtig: " + it.answer; return; }
  msg.className = "msg no";
  if (!norm(s.value)) { msg.textContent = "Du hast noch nichts eingegeben."; return; }
  if (it.word && it.kind !== "number" && it.kind !== "rule" && norm(s.value) === it.word && it.answer !== it.word) { msg.textContent = "Das ist noch die Einzahl. Bilde die Mehrzahl."; return; }
  msg.textContent = nb("Noch nicht richtig. " + it.feedback);
}
function check(task) {
  task.items.forEach(it => { const s = st(it.id); if (s.ok) return; s.checked = true; s.ok = norm(s.value) === norm(it.answer); });
  save(); score(); const y = window.scrollY; render(); window.scrollTo(0, y);
}
function renderPart(v, part) {
  const m = el("section", "card merk"); m.append(el("h2", "", "Teil " + part.id + ": " + part.title));
  part.merk.forEach(t => m.append(el("p", "", nb(t)))); v.append(m);
  part.tasks.forEach((t, n) => {
    const c = el("section", "card"); c.dataset.task = t.id;
    const head = el("div", "task-head"); const h = el("h3", "", "Aufgabe " + (n + 1) + " ");
    const star = el("span", "stars", "★".repeat(t.level)); star.setAttribute("aria-label", t.level + " von 3 Sternen"); h.append(star);
    head.append(h, el("div", "", t.task)); c.append(head);
    t.items.forEach((it, i) => c.append(renderItem(it, "abcd"[i])));
    const ok = t.items.filter(i => st(i.id).ok).length;
    const btn = el("button", "check", ok === 4 ? "Geschafft: 4 von 4 richtig" : "Prüfen (" + ok + " von 4 richtig)");
    btn.disabled = ok === 4; btn.onclick = () => check(t); c.append(btn); v.append(c);
  });
  const idx = DATA.parts.indexOf(part), next = DATA.parts[idx + 1];
  const nav = el("button", "go", next ? "Weiter zu Teil " + next.id : "Zurück zum Plan");
  nav.onclick = () => go(next ? next.id : "start"); v.append(nav);
}
function render() {
  const v = document.getElementById("view"); v.textContent = "";
  if (current === "start") renderStart(v); else renderPart(v, DATA.parts.find(p => p.id === current));
}
document.getElementById("title").textContent = DATA.title;
document.getElementById("subtitle").textContent = DATA.subtitle;
tabs(); score(); render();
</script>
